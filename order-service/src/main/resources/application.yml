spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderflow_orders}
    username: ${DB_USER:orderflow}
    password: ${DB_PASSWORD:orderflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:15}
      connection-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only verifies it.
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all with idempotence on. Anything weaker means a broker failover can
      # silently drop an acknowledged message, and a lost saga command leaves an
      # order stuck in PENDING with no way to notice.
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 20000
        request.timeout.ms: 5000
        linger.ms: 5

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # earliest, so a brand-new consumer group replays the topic from the start
      # rather than silently skipping everything that happened before it existed.
      auto-offset-reset: earliest
      # Offsets are committed by the container after the listener returns, not by
      # a background timer. A timed commit can acknowledge a message that is
      # still being processed, and lose it if the process then dies.
      enable-auto-commit: false
      properties:
        max.poll.records: 50
        # Generous relative to the work: a consumer evicted mid-batch causes a
        # rebalance and a wave of redeliveries.
        max.poll.interval.ms: 300000

    listener:
      ack-mode: record
      concurrency: 3   # Matches the partition count; more threads than
                       # partitions leaves consumers idle.

orderflow:
  consumer-group: order-service
  topic-partitions: 3
  outbox:
    poll-interval: PT0.5S
    batch-size: 100
    send-timeout-seconds: 10

server:
  port: ${PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: order-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  # sagaId and messageId come from the MDC, so every line emitted while handling
  # a message can be traced back to one order without a correlation join.
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{sagaId:-}] %logger{36} - %msg%n"
  level:
    com.orderflow: ${LOG_LEVEL:INFO}
